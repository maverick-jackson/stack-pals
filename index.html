<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fdcf0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stack Pals" />
    <meta name="description" content="Count, build and meet a block buddy for every number from 0 to 9,999." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Stack Pals</title>
    <script>
      // Self-heal: if a cached page asks for files from an older release, wipe the offline cache
      // and load the current release once. Must stay inline and run before any asset loads.
      (function () {
        var KEY = 'sp-heal';
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          // at most once a minute, so a real outage can never cause a reload loop
          try { if (Date.now() - Number(localStorage.getItem(KEY) || 0) < 60000) return; localStorage.setItem(KEY, String(Date.now())); } catch (_) { return; }
          var go = function () { location.replace(location.pathname + '?fresh=' + Date.now()); };
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(go, go);
        }, true);
      })();
    </script>
  </head>
  <body>
    <main id="app">
      <svg class="scenery" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fd3ee" />
            <stop offset="0.7" stop-color="#c6eef7" />
          </linearGradient>
          <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d9f2b4" />
            <stop offset="1" stop-color="#b7e08a" />
          </linearGradient>
          <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c5ea92" />
            <stop offset="1" stop-color="#9fd46a" />
          </linearGradient>
        </defs>
        <rect width="1600" height="1000" fill="url(#sky)" />
        <g class="sun"><g stroke="#f5c542" stroke-width="10" stroke-linecap="round"><path d="M1448 186 L1476 198" /><path d="M1397 238 L1408 265" /><path d="M1324 238 L1312 266" /><path d="M1272 187 L1245 198" /><path d="M1272 114 L1244 102" /><path d="M1323 62 L1312 35" /><path d="M1396 62 L1408 34" /><path d="M1448 113 L1475 102" /></g><circle cx="1360" cy="150" r="70" fill="#ffe27a" stroke="#f5c542" stroke-width="6" /></g>
        <g class="clouds" fill="#fff">
          <g class="cloud c1"><circle cx="190" cy="250" r="44" /><circle cx="245" cy="222" r="61" /><circle cx="311" cy="244" r="50" /><circle cx="355" cy="266" r="35" /><circle cx="152" cy="270" r="33" /><rect x="124" y="256" width="264" height="46" rx="23" /></g>
          <g class="cloud c2"><circle cx="470" cy="160" r="36" /><circle cx="515" cy="138" r="50" /><circle cx="569" cy="156" r="40" /><circle cx="605" cy="174" r="29" /><circle cx="438" cy="176" r="27" /><rect x="416" y="164" width="216" height="38" rx="19" /></g>
          <g class="cloud c3"><circle cx="1150" cy="320" r="30" /><circle cx="1188" cy="301" r="41" /><circle cx="1232" cy="316" r="34" /><circle cx="1262" cy="331" r="24" /><circle cx="1124" cy="334" r="22" /><rect x="1105" y="324" width="180" height="32" rx="16" /></g>
        </g>
        <path d="M-50 640 Q300 470 700 600 T1650 560 V1000 H-50Z" fill="url(#hillBack)" />
        <path d="M-50 760 Q400 640 850 720 T1650 700 V1000 H-50Z" fill="url(#hillFront)" />
        <g fill="#8cc95a" opacity="0.7">
          <path d="M180 820 l6-18 l6 18Z M196 822 l5-14 l5 14Z" />
          <path d="M1240 860 l6-18 l6 18Z M1256 862 l5-14 l5 14Z" />
          <path d="M760 900 l6-18 l6 18Z M776 902 l5-14 l5 14Z" />
        </g>
      </svg>

      <header class="hud" aria-hidden="true">
        <div class="num" id="num">1</div>
        <div class="word" id="word">one</div>
      </header>

      <div class="stage-wrap"><svg id="stage" class="stage" role="img" aria-label="Block buddy"></svg></div>

      <div class="nudge">
        <button class="round plus" data-step="1" aria-label="Add one block">+</button>
        <button class="round minus" data-step="-1" aria-label="Take one block away">&minus;</button>
      </div>

      <button class="menu-btn" id="menuBtn" aria-label="Open the menu" aria-expanded="false" aria-controls="panel">
        <span></span><span></span><span></span>
      </button>

      <aside class="panel" id="panel" aria-label="Menu" inert>
        <div class="grid">
          <button class="pill t1" data-step="1">+1</button>
          <button class="pill t1" data-step="-1">&minus;1</button>
          <button class="pill t10" data-step="10">+10</button>
          <button class="pill t10" data-step="-10">&minus;10</button>
          <button class="pill t100" data-step="100">+100</button>
          <button class="pill t100" data-step="-100">&minus;100</button>
          <button class="pill t1000" data-step="1000">+1000</button>
          <button class="pill t1000" data-step="-1000">&minus;1000</button>
          <button class="pill act count" id="countBtn">Count</button>
          <button class="pill act" id="sayBtn">Say it</button>
          <button class="pill act" id="surpriseBtn">Surprise</button>
          <button class="pill act" id="resetBtn">Reset</button>
        </div>
        <label class="slider">
          <span>Pick a number</span>
          <input id="slider" type="range" min="0" max="9999" step="1" value="1" />
        </label>
        <div class="row">
          <button class="pill small" id="soundBtn" aria-pressed="true">Sound on</button>
          <button class="pill small" id="fullBtn" hidden>Full screen</button>
        </div>
      </aside>

      <div class="sr-only" id="live" aria-live="polite"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
